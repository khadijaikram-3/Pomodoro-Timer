<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pomodoro Timer — Focus & Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-overlay: rgba(0,0,0,0.6);
    --card-bg: rgba(255,255,255,0.08);
    --card-border: rgba(255,255,255,0.18);
    --text: #fff;
    --text-muted: rgba(255,255,255,0.75);
    --shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  body.light {
    --bg-overlay: rgba(255,255,255,0.35);
    --card-bg: rgba(255,255,255,0.75);
    --card-border: rgba(255,255,255,0.9);
    --text: #1a2332;
    --text-muted: rgba(26,35,50,0.7);
    --shadow: 0 8px 32px rgba(31,38,135,0.15);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', 'Roboto', 'Lato', sans-serif;
    color: var(--text);
    min-height: 100vh;
    background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: var(--bg-overlay);
    backdrop-filter: blur(2px);
    z-index: 0;
    transition: background 0.4s ease;
  }
  .app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: minmax(320px, 420px) 1fr;
    gap: 24px;
    padding: 24px;
    min-height: 100vh;
    max-width: 1440px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
  }
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .left { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; max-height: calc(100vh - 48px); }
  @media (max-width: 900px) { .left { max-height: none; } }
  .left::-webkit-scrollbar { width: 6px; }
  .left::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 8px; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.5px; }
  .theme-toggle {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    width: 42px; height: 42px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    display: grid; place-items: center;
    transition: transform 0.2s, background 0.3s;
  }
  .theme-toggle:hover { transform: rotate(20deg) scale(1.08); }

  .section-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .time-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0;
  }
  .time-row label { font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 32px; height: 32px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.1);
    color: var(--text);
    font-size: 1.1rem; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .stepper button:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
  .stepper .val { min-width: 44px; text-align: center; font-weight: 600; font-size: 1.05rem; }

  .task-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.1);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.2s;
  }
  .task-input::placeholder { color: var(--text-muted); }
  .task-input:focus { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card {
    padding: 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--card-border);
    text-align: center;
  }
  .stat-num { font-size: 1.6rem; font-weight: 700; }
  .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .history { display: flex; flex-direction: column; gap: 10px; max-height: 240px; overflow-y: auto; padding-right: 4px; }
  .history::-webkit-scrollbar { width: 4px; }
  .history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  .history-card {
    padding: 12px 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    border: 1px solid var(--card-border);
    transition: transform 0.2s;
  }
  .history-card:hover { transform: translateX(4px); }
  .history-task { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
  .history-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; }
  .empty { color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 14px 0; font-style: italic; }

  .quote-box {
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(118,75,162,0.25), rgba(102,126,234,0.25));
    border: 1px solid var(--card-border);
    font-style: italic;
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.5;
    min-height: 64px;
    display: grid; place-items: center;
    transition: opacity 0.3s;
  }

  .achievement-list { display: flex; flex-direction: column; gap: 8px; }
  .ach-item {
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,193,7,0.15);
    border: 1px solid rgba(255,193,7,0.3);
    font-size: 0.85rem;
  }

  /* RIGHT SIDE */
  .right {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    padding: 30px;
    min-height: calc(100vh - 48px);
  }
  @media (max-width: 900px) { .right { min-height: auto; padding: 20px; } }

  .timer-box {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 40px;
    border-radius: 30px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px rgba(102,126,234,0.25), var(--shadow);
    transition: all 0.5s ease;
  }
  .timer-box.paused {
    opacity: 0.55;
    filter: grayscale(0.6) blur(1px);
    transform: scale(0.98);
    box-shadow: 0 0 20px rgba(255,255,255,0.05);
  }

  .ring-wrap { position: relative; width: 320px; height: 320px; }
  @media (max-width: 480px) { .ring-wrap { width: 260px; height: 260px; } }
  .ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 10; }
  .ring-fg {
    fill: none; stroke: url(#grad); stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 8px rgba(102,126,234,0.6));
  }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .time-display {
    font-size: 4.2rem; font-weight: 700; letter-spacing: 2px;
    color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,0.4);
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 480px) { .time-display { font-size: 3.2rem; } }
  .mode-label {
    margin-top: 8px;
    font-size: 0.85rem; letter-spacing: 3px; font-weight: 600;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
  }
  .current-task {
    font-size: 0.9rem; color: var(--text-muted);
    text-align: center; max-width: 320px;
    font-style: italic;
  }

  .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .btn {
    padding: 14px 26px;
    border-radius: 16px;
    border: none;
    color: white;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 1.2px;
    cursor: pointer;
    min-width: 110px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.2s;
    text-transform: uppercase;
  }
  .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.35); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-start  { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .btn-pause  { background: linear-gradient(135deg, #f7971e, #ffd200); }
  .btn-resume { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
  .btn-reset  { background: linear-gradient(135deg, #834d9b, #d04ed6); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(120%);
    padding: 14px 22px;
    background: rgba(20,20,30,0.95);
    color: #fff;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    font-weight: 600;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT -->
  <aside class="left">
    <div class="panel top-bar">
      <h1>Focus & Flow</h1>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </div>

    <div class="panel">
      <div class="section-title">Time Settings</div>
      <div class="time-row">
        <label>Focus (min)</label>
        <div class="stepper">
          <button data-step="focus" data-dir="-1">−</button>
          <span class="val" id="focusVal">25</span>
          <button data-step="focus" data-dir="1">+</button>
        </div>
      </div>
      <div class="time-row">
        <label>Break (min)</label>
        <div class="stepper">
          <button data-step="break" data-dir="-1">−</button>
          <span class="val" id="breakVal">5</span>
          <button data-step="break" data-dir="1">+</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">Current Task</div>
      <input type="text" id="taskInput" class="task-input" placeholder="What are you working on?" maxlength="80" />
    </div>

    <div class="panel">
      <div class="section-title">Today's Stats</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="statSessions">0</div><div class="stat-label">Sessions</div></div>
        <div class="stat-card"><div class="stat-num" id="statMinutes">0</div><div class="stat-label">Focus Min</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">Motivation</div>
      <div class="quote-box" id="quoteBox">"Small steps every day."</div>
    </div>

    <div class="panel">
      <div class="section-title">History</div>
      <div class="history" id="historyList"><div class="empty">No sessions yet today.</div></div>
    </div>

    <div class="panel">
      <div class="section-title">Achievements</div>
      <div class="achievement-list" id="achList"><div class="empty">Complete sessions to earn achievements!</div></div>
    </div>
  </aside>

  <!-- RIGHT -->
  <main class="right">
    <div class="timer-box" id="timerBox">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 320 320">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#667eea"/>
              <stop offset="100%" stop-color="#764ba2"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="160" cy="160" r="140"/>
          <circle class="ring-fg" id="ringFg" cx="160" cy="160" r="140"
            stroke-dasharray="879.6" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-center">
          <div class="time-display" id="timeDisplay">25:00</div>
          <div class="mode-label" id="modeLabel">Focus Time</div>
        </div>
      </div>
      <div class="current-task" id="currentTaskLabel"></div>
    </div>

    <div class="controls">
      <button class="btn btn-start"  id="btnStart">Start</button>
      <button class="btn btn-pause"  id="btnPause" disabled>Pause</button>
      <button class="btn btn-resume" id="btnResume" disabled>Resume</button>
      <button class="btn btn-reset"  id="btnReset">Reset</button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ===== State =====
  const state = {
    focusMin: 25,
    breakMin: 5,
    mode: 'focus', // 'focus' | 'break'
    remaining: 25 * 60,
    total: 25 * 60,
    running: false,
    paused: false,
    interval: null,
    task: '',
    sessionStart: null,
  };

  const RING_CIRC = 2 * Math.PI * 140;

  // ===== Quote pools =====
  const quotes = {
    start: [
      "You can do this!", "Small steps every day", "Focus on the present moment",
      "Every session brings you closer", "You're building amazing habits",
      "Stay committed to your goals", "Progress over perfection",
      "One pomodoro at a time", "Your future self will thank you",
      "Greatness is built in these moments", "Time to shine", "Deep work awaits"
    ],
    pause: ["Take a deep breath", "Pause and reset", "Breathe in calm, breathe out tension"],
    resume: ["Welcome back! Let's continue", "Right back into the flow", "Pick up where you left off"],
    complete: [
      "Congratulations! Amazing work!", "Session crushed! Beautifully done.",
      "You showed up — incredible!", "That's how it's done!"
    ],
    breakStart: ["Rest well, you earned it", "Recharge those batteries", "Step away and breathe"],
    breakEnd: ["Ready to crush another focus session?", "Back to the deep work", "Let's go again"]
  };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ===== DOM =====
  const $ = id => document.getElementById(id);
  const timeDisplay = $('timeDisplay');
  const modeLabel = $('modeLabel');
  const ringFg = $('ringFg');
  const timerBox = $('timerBox');
  const quoteBox = $('quoteBox');
  const taskInput = $('taskInput');
  const currentTaskLabel = $('currentTaskLabel');
  const btnStart = $('btnStart'), btnPause = $('btnPause'),
        btnResume = $('btnResume'), btnReset = $('btnReset');
  const focusVal = $('focusVal'), breakVal = $('breakVal');
  const statSessions = $('statSessions'), statMinutes = $('statMinutes');
  const historyList = $('historyList'), achList = $('achList');
  const themeToggle = $('themeToggle');
  const toastEl = $('toast');

  ringFg.setAttribute('stroke-dasharray', RING_CIRC);

  // ===== Storage =====
  const today = () => new Date().toISOString().slice(0,10);
  const load = () => {
    const raw = localStorage.getItem('pomo_data');
    let data = raw ? JSON.parse(raw) : null;
    if (!data || data.date !== today()) {
      data = { date: today(), sessions: 0, minutes: 0, history: [], achievements: [] };
    }
    return data;
  };
  const save = d => localStorage.setItem('pomo_data', JSON.stringify(d));
  let data = load();

  // ===== Theme =====
  const applyTheme = t => {
    document.body.classList.toggle('light', t === 'light');
    themeToggle.textContent = t === 'light' ? '☀️' : '🌙';
    localStorage.setItem('pomo_theme', t);
  };
  applyTheme(localStorage.getItem('pomo_theme') || 'dark');
  themeToggle.onclick = () =>
    applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');

  // ===== Helpers =====
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const updateDisplay = () => {
    timeDisplay.textContent = fmt(state.remaining);
    const offset = RING_CIRC * (1 - state.remaining / state.total);
    ringFg.style.strokeDashoffset = offset;
    modeLabel.textContent = state.mode === 'focus' ? 'Focus Time' : 'Break Time';
  };
  const setQuote = txt => { quoteBox.textContent = `"${txt}"`; };
  const showToast = msg => {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
  };

  // ===== Audio =====
  let audioCtx;
  const beep = () => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 220, 440].forEach(delay => {
        setTimeout(() => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.value = 880;
          o.type = 'sine';
          g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
          o.start(); o.stop(audioCtx.currentTime + 0.4);
        }, delay);
      });
    } catch(e){}
  };

  // ===== Voice =====
  const speak = txt => {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.rate = 1; u.pitch = 1; u.volume = 0.9;
      speechSynthesis.speak(u);
    } catch(e){}
  };

  // ===== Render =====
  const renderStats = () => {
    statSessions.textContent = data.sessions;
    statMinutes.textContent = data.minutes;
  };
  const renderHistory = () => {
    if (!data.history.length) {
      historyList.innerHTML = '<div class="empty">No sessions yet today.</div>';
      return;
    }
    historyList.innerHTML = data.history.slice().reverse().map(h => `
      <div class="history-card">
        <div class="history-task">${escapeHtml(h.task || 'Focus session')}</div>
        <div class="history-meta">
          <span>${h.start} → ${h.end}</span>
          <span>${h.duration} min</span>
        </div>
      </div>`).join('');
  };
  const renderAch = () => {
    if (!data.achievements.length) {
      achList.innerHTML = '<div class="empty">Complete sessions to earn achievements!</div>';
      return;
    }
    achList.innerHTML = data.achievements.slice().reverse().slice(0,6)
      .map(a => `<div class="ach-item">${escapeHtml(a)}</div>`).join('');
  };
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ===== Achievements =====
  const achievementChecks = [
    { n:1,  msg:"✨ First session complete! A great start!" },
    { n:3,  msg:"🌱 3 sessions — momentum is building!" },
    { n:5,  msg:"🔥 5 sessions completed! You're on fire!" },
    { n:10, msg:"⭐ 10 sessions! You're a focus master!" },
    { n:15, msg:"🚀 15 sessions! Unstoppable!" },
    { n:25, msg:"🏆 25 sessions! Legendary status!" },
  ];
  const minuteChecks = [
    { m:60,  msg:"💪 1 hour total! Incredible dedication!" },
    { m:120, msg:"💪 2 hours total! Incredible dedication!" },
    { m:240, msg:"👑 4 hours of focus today — wow!" },
  ];
  const checkAchievements = () => {
    achievementChecks.forEach(a => {
      if (data.sessions === a.n) {
        data.achievements.push(a.msg);
        showToast(a.msg);
      }
    });
    minuteChecks.forEach(a => {
      if (data.minutes >= a.m && !data.achievements.includes(a.msg)) {
        data.achievements.push(a.msg);
        showToast(a.msg);
      }
    });
  };

  // ===== Timer logic =====
  const tick = () => {
    if (!state.running || state.paused) return;
    state.remaining--;
    updateDisplay();
    if (state.remaining <= 0) finishSession();
  };

  const startTimer = () => {
    if (state.running) return;
    state.task = taskInput.value.trim();
    currentTaskLabel.textContent = state.task ? `Working on: ${state.task}` : '';
    state.total = (state.mode === 'focus' ? state.focusMin : state.breakMin) * 60;
    state.remaining = state.total;
    state.running = true;
    state.paused = false;
    state.sessionStart = new Date();
    updateDisplay();
    state.interval = setInterval(tick, 1000);
    btnStart.disabled = true; btnPause.disabled = false;
    btnResume.disabled = true; btnReset.disabled = false;
    timerBox.classList.remove('paused');
    setQuote(pick(quotes.start));
    speak("Let's begin! You can do this!");
  };

  const pauseTimer = () => {
    if (!state.running || state.paused) return;
    state.paused = true;
    timerBox.classList.add('paused');
    btnPause.disabled = true; btnResume.disabled = false;
    setQuote(pick(quotes.pause));
    speak("Timer paused. Take a moment.");
  };

  const resumeTimer = () => {
    if (!state.running || !state.paused) return;
    state.paused = false;
    timerBox.classList.remove('paused');
    btnPause.disabled = false; btnResume.disabled = true;
    setQuote(pick(quotes.resume));
    speak("Resumed. Keep going strong!");
  };

  const resetTimer = (silent=false) => {
    clearInterval(state.interval);
    state.running = false; state.paused = false;
    state.mode = 'focus';
    state.total = state.focusMin * 60;
    state.remaining = state.total;
    timerBox.classList.remove('paused');
    btnStart.disabled = false; btnPause.disabled = true;
    btnResume.disabled = true;
    currentTaskLabel.textContent = '';
    updateDisplay();
    if (!silent) {
      setQuote("Fresh start, fresh focus");
      speak("Timer reset. Ready to start fresh?");
    }
  };

  const finishSession = () => {
    clearInterval(state.interval);
    state.running = false; state.paused = false;
    beep();

    if (state.mode === 'focus') {
      const end = new Date();
      const startStr = state.sessionStart.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const endStr = end.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      data.sessions++;
      data.minutes += state.focusMin;
      data.history.push({
        task: state.task || 'Focus session',
        start: startStr, end: endStr, duration: state.focusMin
      });
      save(data);
      renderStats(); renderHistory();
      setQuote(pick(quotes.complete));
      speak("Congratulations! You completed your focus session! Amazing work!");
      confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 },
        colors: ['#667eea','#764ba2','#11998e','#38ef7d','#f7971e','#ffd200'] });
      checkAchievements();
      renderAch();
      // switch to break
      setTimeout(() => {
        state.mode = 'break';
        state.total = state.breakMin * 60;
        state.remaining = state.total;
        updateDisplay();
        setQuote(pick(quotes.breakStart));
        speak("Break time! Rest well and recharge.");
        state.running = true; state.sessionStart = new Date();
        state.interval = setInterval(tick, 1000);
        btnStart.disabled = true; btnPause.disabled = false;
      }, 1500);
    } else {
      // break done
      setQuote(pick(quotes.breakEnd));
      speak("Break is over! Time to focus again. You've got this!");
      state.mode = 'focus';
      state.total = state.focusMin * 60;
      state.remaining = state.total;
      updateDisplay();
      btnStart.disabled = false; btnPause.disabled = true; btnResume.disabled = true;
    }
  };

  // ===== Steppers =====
  document.querySelectorAll('.stepper button').forEach(b => {
    b.onclick = () => {
      if (state.running) return; // lock during run
      const which = b.dataset.step, dir = +b.dataset.dir;
      if (which === 'focus') {
        state.focusMin = Math.min(60, Math.max(1, state.focusMin + dir));
        focusVal.textContent = state.focusMin;
      } else {
        state.breakMin = Math.min(30, Math.max(1, state.breakMin + dir));
        breakVal.textContent = state.breakMin;
      }
      if (!state.running) {
        state.total = (state.mode === 'focus' ? state.focusMin : state.breakMin) * 60;
        state.remaining = state.total;
        updateDisplay();
      }
    };
  });

  // ===== Buttons =====
  btnStart.onclick = startTimer;
  btnPause.onclick = pauseTimer;
  btnResume.onclick = resumeTimer;
  btnReset.onclick = () => resetTimer(false);

  // ===== Init =====
  updateDisplay();
  renderStats(); renderHistory(); renderAch();
  setQuote(pick(quotes.start));
})();
</script>
</body>
</html>
