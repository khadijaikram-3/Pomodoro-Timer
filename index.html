<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pomodoro Timer — Focus & Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <!-- LEFT -->
  <aside class="left">
    <div class="panel top-bar">
      <h1>Focus & Flow</h1>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </div>

    <div class="panel">
      <div class="section-title">Time Settings</div>
      <div class="time-row">
        <label>Focus (min)</label>
        <div class="stepper">
          <button data-step="focus" data-dir="-1">−</button>
          <span class="val" id="focusVal">25</span>
          <button data-step="focus" data-dir="1">+</button>
        </div>
      </div>
      <div class="time-row">
        <label>Break (min)</label>
        <div class="stepper">
          <button data-step="break" data-dir="-1">−</button>
          <span class="val" id="breakVal">5</span>
          <button data-step="break" data-dir="1">+</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">Current Task</div>
      <input type="text" id="taskInput" class="task-input" placeholder="What are you working on?" maxlength="80" />
    </div>

    <div class="panel">
      <div class="section-title">Today's Stats</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="statSessions">0</div><div class="stat-label">Sessions</div></div>
        <div class="stat-card"><div class="stat-num" id="statMinutes">0</div><div class="stat-label">Focus Min</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">Motivation</div>
      <div class="quote-box" id="quoteBox">"Small steps every day."</div>
    </div>

    <div class="panel">
      <div class="section-title">History</div>
      <div class="history" id="historyList"><div class="empty">No sessions yet today.</div></div>
    </div>

    <div class="panel">
      <div class="section-title">Achievements</div>
      <div class="achievement-list" id="achList"><div class="empty">Complete sessions to earn achievements!</div></div>
    </div>
  </aside>

  <!-- RIGHT -->
  <main class="right">
    <div class="timer-box" id="timerBox">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 320 320">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#667eea"/>
              <stop offset="100%" stop-color="#764ba2"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="160" cy="160" r="140"/>
          <circle class="ring-fg" id="ringFg" cx="160" cy="160" r="140"
            stroke-dasharray="879.6" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-center">
          <div class="time-display" id="timeDisplay">25:00</div>
          <div class="mode-label" id="modeLabel">Focus Time</div>
        </div>
      </div>
      <div class="current-task" id="currentTaskLabel"></div>
    </div>

    <div class="controls">
      <button class="btn btn-start"  id="btnStart">Start</button>
      <button class="btn btn-pause"  id="btnPause" disabled>Pause</button>
      <button class="btn btn-resume" id="btnResume" disabled>Resume</button>
      <button class="btn btn-reset"  id="btnReset">Reset</button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
